name = "studytracker-v2-staging"
main = "worker.js"
compatibility_date = "2026-09-18"

[vars]
ENVIRONMENT = "staging"
STAGING = "true"
STORAGE_BACKEND = "kv"

# Canonical V2 backend is Cloudflare KV.
# The deployment script resolves/creates the dedicated STUDY_SYNC_KV_STAGING
# namespace and binds it to STUDY_SYNC_KV at deploy time.
