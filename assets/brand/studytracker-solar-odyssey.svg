<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" role="img" aria-label="StudyTracker güneş sistemi: açık kitaptan yükselen yıldız, dönerek açılan gezegenler, ışık ve kuyruklu yıldız">
<title>StudyTracker — Solar Odyssey</title>
<desc>Gerçek vektör ve CSS animasyonu. Güneş yükselir, gezegenler yörüngede döner ve kitaptan çıkan yıldız ışığıyla StudyTracker simgesi belirir.</desc>
<defs>
 <linearGradient id="deepSpace" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#090623"/><stop offset=".52" stop-color="#201358"/><stop offset="1" stop-color="#050E29"/></linearGradient>
 <radialGradient id="nebula"><stop stop-color="#793EDA" stop-opacity=".52"/><stop offset=".45" stop-color="#4B27B8" stop-opacity=".17"/><stop offset="1" stop-color="#221343" stop-opacity="0"/></radialGradient>
 <radialGradient id="solar"><stop stop-color="#FFFECE"/><stop offset=".13" stop-color="#FFE68B"/><stop offset=".29" stop-color="#FFB13A" stop-opacity=".88"/><stop offset=".55" stop-color="#BC5299" stop-opacity=".38"/><stop offset="1" stop-color="#512FBE" stop-opacity="0"/></radialGradient>
 <radialGradient id="jupiter" cx=".28" cy=".2"><stop stop-color="#FFF2CA"/><stop offset=".37" stop-color="#DDA98C"/><stop offset=".68" stop-color="#A16A8B"/><stop offset="1" stop-color="#3B285B"/></radialGradient>
 <radialGradient id="saturn" cx=".29" cy=".16"><stop stop-color="#FFF0C0"/><stop offset=".49" stop-color="#F2BF83"/><stop offset="1" stop-color="#78548A"/></radialGradient>
 <radialGradient id="earth" cx=".28" cy=".19"><stop stop-color="#BCEFFD"/><stop offset=".42" stop-color="#447BCB"/><stop offset=".75" stop-color="#214B9D"/><stop offset="1" stop-color="#131943"/></radialGradient>
 <radialGradient id="mars" cx=".3" cy=".23"><stop stop-color="#FFDAA5"/><stop offset=".54" stop-color="#CA7862"/><stop offset="1" stop-color="#5E3657"/></radialGradient>
 <linearGradient id="goldStroke"><stop stop-color="#FFF6B3" stop-opacity="0"/><stop offset=".35" stop-color="#F4B66C" stop-opacity=".74"/><stop offset=".7" stop-color="#FFE9A2"/><stop offset="1" stop-color="#FFF1AD" stop-opacity=".07"/></linearGradient>
 <linearGradient id="comet"><stop stop-color="#7B43D9" stop-opacity="0"/><stop offset=".45" stop-color="#A878FF"/><stop offset=".74" stop-color="#6DEBFF"/><stop offset="1" stop-color="#FFF1AB"/></linearGradient>
 <filter id="aura" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
 <filter id="softLight" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="11"/></filter>
 <clipPath id="roundedMark"><rect x="0" y="0" width="108" height="108" rx="25"/></clipPath>
</defs>
<style>
 svg{background:#090623} .twinkle{animation:twinkle 1.35s ease-in-out infinite alternate}
 .orbital{fill:none;stroke:url(#goldStroke);stroke-width:1.25;opacity:.8;stroke-dasharray:3 3;animation:orbitReveal .75s ease-out both}
 .reveal{transform-box:fill-box;transform-origin:center;animation:reveal 1.1s cubic-bezier(.17,1.45,.48,1) both}
 .rising{animation:rise .95s ease-out both;transform-origin:center}
 .sunPulse{animation:sunPulse 1.7s ease-in-out infinite alternate;transform-origin:180px 562px}
 .spinA{transform-origin:180px 345px;animation:spin 4.5s linear infinite}
 .spinB{transform-origin:180px 345px;animation:spinReverse 6s linear infinite}
 .spinC{transform-origin:180px 345px;animation:spin 7.5s linear infinite}
 .cometFlight{animation:cometFlight 1.8s cubic-bezier(.28,0,.25,1) infinite;offset-path:path('M -40 195 Q 180 75 397 240 Q 451 380 245 445');offset-rotate:auto}
 .beams{transform-origin:180px 562px;animation:rise 1s ease-out both}
 .iconHalo{animation:haloPulse 1.5s ease-in-out infinite alternate;transform-origin:180px 345px}
 @keyframes reveal{0%{opacity:0;transform:translateY(70px) scale(.36) rotate(-14deg)}55%{opacity:1;transform:translateY(-9px) scale(1.05) rotate(4deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
 @keyframes rise{from{opacity:0;transform:translateY(65px) scale(.35)}to{opacity:1;transform:translateY(0) scale(1)}}
 @keyframes orbitReveal{from{stroke-dashoffset:260;opacity:0}to{stroke-dashoffset:0;opacity:.75}}
 @keyframes spin{to{transform:rotate(360deg)}} @keyframes spinReverse{to{transform:rotate(-360deg)}}
 @keyframes twinkle{from{opacity:.22;transform:scale(.7);transform-origin:center}to{opacity:1;transform:scale(1.2);transform-origin:center}}
 @keyframes sunPulse{from{opacity:.75;transform:scale(.91)}to{opacity:1;transform:scale(1.13)}}
 @keyframes haloPulse{from{opacity:.32;transform:scale(.98)}to{opacity:.73;transform:scale(1.06)}}
 @keyframes cometFlight{from{offset-distance:0%;opacity:0}15%{opacity:1}85%{opacity:1}to{offset-distance:100%;opacity:0}}
 @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
