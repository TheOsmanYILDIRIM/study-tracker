name: Build & Release StudyTracker APK

concurrency:
  group: studytracker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main", "feature/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew test --stacktrace

      - name: Run Worker integration tests
        run: |
          node worker/test-sync.js
          node worker/test-v2.js

      - name: Run CLI tests
        run: |
          node cli/test-revision.js
          node cli/test-v2.js

      - name: Build portable V2 catalog bundle
        run: |
          npm run content:validate
          npm run content:bundle

      - name: Upload V2 catalog bundle
        uses: actions/upload-artifact@v4
        with:
          name: StudyTracker-v2-catalog
          path: dist/studytracker-v2-catalog.json
          retention-days: 14

      - name: Configure release signing
        env:
          STUDYTRACKER_KEYSTORE_B64: ${{ secrets.STUDYTRACKER_KEYSTORE_B64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STUDYTRACKER_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.STUDYTRACKER_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.STUDYTRACKER_KEY_PASSWORD }}
        run: |
          if [ -n "$STUDYTRACKER_KEYSTORE_B64" ]; then
            echo "$STUDYTRACKER_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/app/release.keystore"
            echo "STUDYTRACKER_KEYSTORE_PATH=$GITHUB_WORKSPACE/app/release.keystore" >> "$GITHUB_ENV"
            echo "STUDYTRACKER_KEYSTORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "STUDYTRACKER_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "STUDYTRACKER_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
          elif [ -f "$GITHUB_WORKSPACE/app/antigravity.keystore" ]; then
            echo "STUDYTRACKER_KEYSTORE_PATH=$GITHUB_WORKSPACE/app/antigravity.keystore" >> "$GITHUB_ENV"
            echo "STUDYTRACKER_KEYSTORE_PASSWORD=antigravity_android_key" >> "$GITHUB_ENV"
            echo "STUDYTRACKER_KEY_ALIAS=antigravity" >> "$GITHUB_ENV"
            echo "STUDYTRACKER_KEY_PASSWORD=antigravity_android_key" >> "$GITHUB_ENV"
            echo "Using canonical antigravity.keystore for release signing."
          else
            echo "::warning::Release signing secrets are not configured; APKs will be unsigned."
          fi

      - name: Build Release APKs
        run: ./gradlew assembleRelease --stacktrace --info

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: StudyTracker-release-apks
          path: app/build/outputs/apk/**/release/*.apk
          retention-days: 14

