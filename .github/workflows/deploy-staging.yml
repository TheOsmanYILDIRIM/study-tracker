name: Deploy StudyTracker V2 Staging Worker & D1

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/v2-phase1-measurement-curriculum"
      - "staging"
    paths:
      - "worker/**"
      - ".github/workflows/deploy-staging.yml"

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run V2 Integration & Staging Test Suite
        run: |
          node worker/test-v2.js
          node worker/test-v2-staging.js
          node cli/test-v2.js
          node cli/test-revision.js

      - name: Deploy Staging Worker & D1 if credentials configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare staging credentials not configured; staging deployment skipped."
            exit 0
          fi
          node worker/deploy-staging.js
