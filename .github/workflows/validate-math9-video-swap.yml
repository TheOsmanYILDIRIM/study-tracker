name: Validate Mathematics video source swap
# Re-run after preserving historical quiz provenance with pending regrounding.

on:
  push:
    branches: [main]
    paths:
      - 'content/v2/items/item_mat9_vid_*.json'
      - '.github/workflows/validate-math9-video-swap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate replacement coverage and preserve unmatched topics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          items = sorted(Path('content/v2/items').glob('item_mat9_vid_*.json'))
          videos = [json.loads(p.read_text(encoding='utf-8')) for p in items if not p.name.endswith('__quiz.json')]
          replaced = [v for v in videos if v.get('payload',{}).get('provenance',{}).get('sourcePlaylistId') == 'PLSYiXUktJiZeqUJyNFUgFHwOUNydbC-II']
          remaining = [v for v in videos if v not in replaced]
          assert len(videos)==29, len(videos)
          assert len(replaced)==26, len(replaced)
          assert len(remaining)==3, len(remaining)
          assert all(v['itemType']=='VIDEO' and v['courseId']=='course_mat_9' for v in videos)
          assert all(v['contentUrl'].startswith('https://www.youtube.com/watch?v=') for v in replaced)
          assert all(v['payload']['provenance']['quizRegroundingStatus']=='pending' for v in replaced)
          print('PASS: 26 replaced, 3 retained due to missing direct curriculum coverage')
          print('Retained:', ', '.join(v['id'] for v in remaining))
          PY
      - name: Compile existing V2 catalog and validate CLI
        run: |
          node scripts/compile-v2-catalog.cjs
          node cli/test-v2.js
      - name: Commit regenerated catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/9-sinif-v2-catalog.json
          if git diff --cached --quiet; then
            echo 'Compiled catalog already up to date.'
            exit 0
          fi
          git commit -m 'content: compile reviewed Mathematics video source changes [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
